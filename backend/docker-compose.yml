services:
  postgres:
    image: postgres:18-alpine
    container_name: novamart-postgres
    restart: always
    environment:
      POSTGRES_DB: novamart_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - novamart_pgdata:/var/lib/postgresql/data

volumes:
  novamart_pgdata:
